name: Publish CLI

# CLI 是独立 Go module，用自己的标签发布：cli-v0.1.0。与应用的 v* 标签互不影响，
# 也不参与“Latest”判断，避免抢占 Host Updater 和应用安装脚本使用的版本。
on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "构建版本号，例如 0.1.0（手动触发只产出构建产物，不创建 Release）"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve CLI version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      publish: ${{ steps.info.outputs.publish }}
      contract: ${{ steps.info.outputs.contract }}
      build_time: ${{ steps.info.outputs.build_time }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: false
      - id: info
        name: Validate release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" = "push" ]]; then
            [[ "$REF_NAME" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
              echo "CLI release tag must look like cli-v0.1.0, got $REF_NAME" >&2
              exit 1
            }
            version="${REF_NAME#cli-v}"
            publish=true
          else
            [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
              echo "workflow_dispatch version must look like 0.1.0, got $INPUT_VERSION" >&2
              exit 1
            }
            version="$INPUT_VERSION"
            publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=cli-v$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          # 契约版本以源码为准，避免发布资产里再维护一份容易漂移的常量。
          contract="$(cd cli && go run ./cmd/yingce version --json | jq -r '.contract')"
          [[ -n "$contract" && "$contract" != "null" ]] || { echo "无法读取 CLI 契约版本" >&2; exit 1; }
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
          echo "build_time=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    name: CLI checks
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            echo "::error::Go files require gofmt. Run gofmt -w on the files listed above."
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Run tests
        run: go test -count=1 ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: Build binary
        working-directory: cli
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          asset="yingce_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            asset="${asset}.exe"
          fi
          mkdir -p "$RUNNER_TEMP/dist"
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
            -ldflags="-s -w -X yingce/cli/internal/commands.Version=$VERSION -X yingce/cli/internal/commands.Commit=$COMMIT" \
            -o "$RUNNER_TEMP/dist/$asset" ./cmd/yingce
          ls -lh "$RUNNER_TEMP/dist/$asset"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/dist/yingce_*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish CLI release
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.outputs.publish == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Stage release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CONTRACT: ${{ needs.prepare.outputs.contract }}
          BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          dist="$RUNNER_TEMP/dist"
          cp cli/internal/skill/SKILL.md "$dist/SKILL.md"
          cp cli/install.sh "$dist/install.sh"
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg contractVersion "$CONTRACT" \
            --arg commit "$COMMIT" \
            --arg buildTime "$BUILD_TIME" \
            '{version: $version, tag: $tag, contractVersion: $contractVersion, commit: $commit, buildTime: $buildTime}' \
            > "$dist/version.json"
          # 只对二进制生成校验清单，安装脚本按精确文件名查找。
          (cd "$dist" && LC_ALL=C sha256sum yingce_* > SHA256SUMS)
          cat "$dist/SHA256SUMS"
          cat > "$dist/RELEASE_NOTES.md" <<EOF
          影策 CLI ${VERSION}（契约 ${CONTRACT}）

          安装：

          \`\`\`bash
          curl -fsSL https://yingce.tv/cli/install.sh | bash
          \`\`\`

          从本 Release 直接安装：

          \`\`\`bash
          YINGCE_CLI_BASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download \\
          YINGCE_CLI_VERSION=${TAG} \\
            bash install.sh
          \`\`\`

          升级：重新运行安装脚本覆盖二进制；v0.1 不内置自更新。
          EOF
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          dist="$RUNNER_TEMP/dist"
          assets=(
            "$dist"/yingce_*
            "$dist/SHA256SUMS"
            "$dist/SKILL.md"
            "$dist/version.json"
            "$dist/install.sh"
          )
          # CLI Release 永远不是仓库的 Latest；否则会抢走应用版本安装脚本使用的“最新版”。
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            exit 0
          fi
          extra=()
          if [[ "$VERSION" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --title "CLI $TAG" \
            --notes-file "$dist/RELEASE_NOTES.md" \
            --latest=false \
            "${extra[@]}"
